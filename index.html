:root{--brand:#FFD400;--ink:#0b0b0d;--bg:#f3f1ea;--surface:#fff;--surface2:#f8f7f2;--fg:#16161a;--muted:#6b6a66;--line:#e2dfd4;--ok:#1f8a4c;--okbg:#e3f4ea;--warn:#8a5d00;--warnbg:#fff4cc;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;padding:16px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h3{margin:0}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.phone{max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.c-top{background:var(--brand);color:var(--ink);padding:22px 22px 30px;display:flex;flex-direction:column;gap:14px}
.c-top img{height:44px;width:auto;align-self:flex-start}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.75}
.c-top h1{font-size:25px;line-height:1.15;text-wrap:balance}
.c-status{margin:-18px 16px 0;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.c-status .dot{width:44px;height:44px;border-radius:14px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.c-status b{display:block;font-size:17px}
.c-status span{font-size:13px;color:#c9c9cf}
.c-body{padding:20px 18px 24px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;color:var(--fg);text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.pay{border:2px solid var(--brand);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--fg);font-weight:500}
.chk input{width:20px;height:20px;accent-color:#c9a800}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:22px;font-variant-numeric:tabular-nums}
.qr{align-self:center;background:#fff;padding:10px;border-radius:12px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.qr img,.qr canvas{width:180px!important;height:180px!important}
.pix{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface2);border-radius:10px;padding:10px;overflow-wrap:anywhere;max-height:66px;overflow:hidden}
.note{font-size:12.5px;color:var(--muted);margin:0}
.paid{display:flex;gap:10px;align-items:center;background:var(--okbg);color:var(--ok);border-radius:12px;padding:12px;font-weight:600;font-size:14px}
.pend{display:flex;gap:10px;align-items:center;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;font-weight:500;font-size:14px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li::after{content:"";position:absolute;left:12px;top:24px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done::after{background:var(--ok)}
.tl .b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;z-index:1}
.tl li.done .b{background:var(--ok);border-color:var(--ok)}
.tl li.now .b{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 5px rgba(255,212,0,.3)}
.tl .t{font-weight:600;font-size:14.5px}
.tl li:not(.done):not(.now) .t{color:var(--muted);font-weight:500}
.tl .d{font-size:12.5px;color:var(--muted)}
.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc .dh{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface2);font-size:13px;color:var(--muted)}
.doc table{width:100%;border-collapse:collapse;font-size:14px}
.doc td{padding:10px 14px;border-top:1px solid var(--line)}
.doc td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc tr.t td{font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.wa{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:14px;text-decoration:none}
.wa b{font-size:18px;display:block}
.wa span{font-size:12px;color:#bdbdc3;letter-spacing:.08em}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

const LOJA = "Rua Novo Horizonte, 87 · Nova Canaã";
const WA_TXT = "(94) 99236-1576", WA_NUM = "5594992361576";
const P = PEDIDO;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const brl = v => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const total = P.itens.reduce((a, i) => a + Number(i[1] || 0), 0);

function emv(id, v) { return id + String(v.length).padStart(2, "0") + v; }
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, "0"); }
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
function pixCode() {
  if (P.pix_codigo.trim()) return P.pix_codigo.trim();
  const p = emv("00", "01") + emv("26", emv("00", "br.gov.bcb.pix") + emv("01", P.pix_chave.trim())) + emv("52", "0000") + emv("53", "986") + emv("54", total.toFixed(2)) + emv("58", "BR") + emv("59", semAcento(P.pix_nome).slice(0, 25)) + emv("60", semAcento(P.pix_cidade).slice(0, 15)) + emv("62", emv("05", ("PED" + P.numero).replace(/[^A-Za-z0-9]/g, "").slice(0, 25))) + "6304";
  return p + crc16(p);
}

const ETAPAS = [
  ["aguardando_pagamento", "Pedido registrado"],
  ["pago", "Pagamento confirmado"],
  ["encomendado", "Produto encomendado"],
  ["a_caminho", "A caminho"],
  ["chegou", P.recebimento === "entrega" ? "Saiu para entrega" : "Pronto para retirada"],
  ...(P.instalacao ? [["instalacao_agendada", "Instalação agendada"]] : []),
  ["concluido", "Concluído"],
];
let atual = ETAPAS.findIndex(e => e[0] === P.etapa); if (atual < 0) atual = 0;
const instNome = P.instalacao === "veiculo" ? "Em veículo" : "Em casa";

function detalhe(key) {
  switch (key) {
    case "aguardando_pagamento": return "Em " + P.data_pedido;
    case "pago": return P.data_pagamento ? "Em " + P.data_pagamento : "";
    case "encomendado": return P.previsao_chegada ? "Previsão de chegada: " + P.previsao_chegada : "";
    case "chegou": return P.recebimento === "entrega" ? "Entraremos em contato para combinar o horário" : LOJA;
    case "instalacao_agendada": return P.instalacao_data ? P.instalacao_data + (P.instalacao_hora ? " às " + P.instalacao_hora : "") : "Entraremos em contato para agendar";
    case "concluido": return P.nota === "emitida" ? "Nota fiscal emitida" : "";
  }
  return "";
}

const CODIGO = "RDR" + P.data_pedido.split("/").reverse().join("").slice(2) + "-" + P.numero;
// Code 128 (conjunto B) — código de barras do pedido
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(txt) {
  const v = [104]; for (const ch of txt) { const c = ch.charCodeAt(0) - 32; if (c < 0 || c > 94) continue; v.push(c); }
  let sum = v[0]; for (let i = 1; i < v.length; i++) sum += v[i] * i; v.push(sum % 103); v.push(106);
  return v.map(i => C128[i]).join("");
}
function barras(x, txt, bx, by, bw, bh) {
  const pat = code128(txt), mods = [...pat].reduce((a, d) => a + +d, 0) + 20, m = bw / mods;
  let cx = bx + 10 * m, bar = true;
  x.fillStyle = "#000";
  for (const d of pat) { const w = +d * m; if (bar) x.fillRect(Math.round(cx), by, Math.max(1, Math.round(cx + w) - Math.round(cx)), bh); cx += w; bar = !bar; }
}
function wrap(ctx, txt, maxW) { const w = String(txt).split(" "), out = []; let l = ""; for (const p of w) { const t = l ? l + " " + p : p; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = p; } else l = t; } if (l) out.push(l); return out; }
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
async function desenharComprovante() {
  try { await document.fonts.load("700 40px 'Courier Prime'"); await document.fonts.load("400 20px 'Courier Prime'"); } catch {}

  const T = (t, px, py, font, align = "left") => { x.font = font; x.textAlign = align; x.fillStyle = K; x.fillText(t, px, py); x.textAlign = "left"; };

  const M = 24, R = W - M, ent = P.recebimento === "entrega";

  line(cA, a0, cA, a1);

  T("Pedido em " + P.data_pedido, cA + 24, a0 + 152, `400 18px ${F}`);
  line(cB, a0, cB, a1);
  T(ent ? "E" : "R", (cB + cC) / 2, a0 + 118, `700 112px ${F}`, "center");
  T(ent ? "ENTREGA" : "RETIRADA", (cB + cC) / 2, a0 + 158, `700 18px ${F}`, "center");
  line(cC, a0, cC, a1);
  let qrOk = false;
  if (window.QRCode) { const d = document.createElement("div"); new QRCode(d, { text: location.href.split("#")[0], width: 156, height: 156, correctLevel: QRCode.CorrectLevel.M }); const qc = d.querySelector("canvas"); if (qc) { x.imageSmoothingEnabled = false; x.drawImage(qc, cC + 12, a0 + 12, 156, 156); qrOk = true; } }
  if (!qrOk) T("QR CODE", (cC + R) / 2, a0 + 96, `700 18px ${F}`, "center");
  line(M, a1, R, a1);

  // ---- faixa 2: dados rápidos ----
  const b1 = a1 + 76;
  const cols = [["PAGAMENTO", "PAGO"], ["DATA DO PAGAMENTO", P.data_pagamento || "—"], ["FORMA", (P.forma_pagamento || "—").toUpperCase()], ["PRAZO", "ATÉ 5 DIAS ÚTEIS"], ["VOLUME", "1/1"]];
  const cw = [190, 290, 180, 330, 162];
  let cx0 = M;
  cols.forEach((cc, i) => { if (i) line(cx0, a1, cx0, b1, 2); T(cc[0], cx0 + 16, a1 + 28, `700 14px ${F}`); T(cc[1], cx0 + 16, a1 + 60, `700 24px ${F}`); cx0 += cw[i]; });
  line(M, b1, R, b1);

  // ---- faixa 3: destinatário + remetente | conteúdo ----
  const mid = 610;
  let yl = b1 + 20;
  tag("DESTINATÁRIO", M + 20, yl); yl += 64;
  x.font = `700 26px ${F}`; wrap(x, P.cliente_nome || P.cliente, mid - M - 48).forEach(t => { T(t, M + 24, yl, `700 26px ${F}`); yl += 32; });
  T("CPF " + P.documento, M + 24, yl, `400 19px ${F}`); yl += 28;
  x.font = `400 19px ${F}`;
  wrap(x, ent ? "Entrega: " + (P.endereco_entrega || "a combinar") : "Retirada na loja · " + EMPRESA.loja, mid - M - 48).forEach(t => { T(t, M + 24, yl, `400 19px ${F}`); yl += 26; });
  if (P.instalacao) { T("Instalação " + (P.instalacao === "veiculo" ? "em veículo" : "em casa") + (P.instalacao_data ? " · " + P.instalacao_data + (P.instalacao_hora ? " às " + P.instalacao_hora : "") : " · a agendar"), M + 24, yl, `400 19px ${F}`); yl += 26; }
  yl += 6; line(M, yl, mid, yl, 2); yl += 18;
  tag("REMETENTE", M + 20, yl); yl += 62;
  const blk = (txt, font, lh) => { x.font = font; wrap(x, txt, mid - M - 48).forEach(t => { T(t, M + 24, yl, font); yl += lh; }); };
  blk(EMPRESA.nome, `700 21px ${F}`, 27);
  blk(EMPRESA.razao, `400 17px ${F}`, 23);
  blk("CNPJ " + EMPRESA.cnpj, `400 17px ${F}`, 23);
  blk(EMPRESA.end, `400 17px ${F}`, 23);
  blk("WhatsApp " + EMPRESA.tel, `400 17px ${F}`, 23); yl -= 13;

  let yr = b1 + 20;
  tag("CONTEÚDO", mid + 20, yr); T("VALOR", R - 24, yr + 24, `700 15px ${F}`, "right"); yr += 34;
  P.itens.forEach(it => {
    yr += 34; T(it[0], mid + 24, yr, `700 20px ${F}`); T(Number(it[1]) ? brl(it[1]) : "—", R - 24, yr, `700 20px ${F}`, "right");
    if (it[2]) { x.font = `400 18px ${F}`; wrap(x, "(" + it[2] + ")", R - mid - 230).forEach(ln => { yr += 25; T(ln, mid + 24, yr, `400 18px ${F}`); }); }
    yr += 6;
  });
  yr += 12; line(mid + 24, yr, R - 24, yr, 2);
  yr += 40; T("TOTAL PAGO", mid + 24, yr, `700 26px ${F}`); T(brl(total), R - 24, yr, `700 26px ${F}`, "right");
  const c1 = Math.max(yl, yr) + 24;

  line(M, c1, R, c1);

  // ---- faixa 4: código de barras ----
  T(CODIGO, W / 2, c1 + 40, `700 26px ${F}`, "center");
  barras(x, CODIGO, W / 2 - 380, c1 + 56, 760, 92);
  T(CODIGO.split("").join(" "), W / 2, c1 + 176, `400 16px ${F}`, "center");
  const d1 = c1 + 196;

}
async function mostrarComprovante() {
